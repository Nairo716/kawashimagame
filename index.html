<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<title>川島都市圏鉄道</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 全面の路線図キャンバスの上に、ゲーム風のカードUIを四隅と下中央に重ねる（明るい単一テーマ） */
:root{
  --land:#F7F7F3; --water:#CFE5F2; --water-ink:#7DA9C4; --park:#DCEDD5;
  --ink:#1E2329; --muted:#8A9096; --card:#FFFFFF; --rule:#E3E5E1;
  --gold:#F4B400; --good:#2DA44E; --good-bg:#E3F5E6; --bad:#D9412B;
  --b-line:#2F7BE5; --b-car:#22A55B; --b-sight:#F0A400; --b-bank:#8A55D8; --b-set:#9AA1A8;
  --font:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(12px + env(safe-area-inset-top,0px)); --gb:calc(12px + env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--land);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{-webkit-tap-highlight-color:transparent}
#cv.drag{cursor:grabbing}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 22px rgba(30,35,41,.10);border:1px solid var(--rule)}
.num{font-variant-numeric:tabular-nums}

/* 上中央：レベルと時計 */
#hudTop{position:fixed;top:var(--gt);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:8px 18px 8px 10px;z-index:3}
.lvBadge{width:48px;height:48px;border-radius:50%;background:#7C4DDB;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.35rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);flex:0 0 auto}
.lvText{display:flex;flex-direction:column;gap:5px;min-width:120px}
.lvText b{font-size:1.05rem;font-weight:800}
.lvText b span{color:#7C4DDB;font-size:.85rem;margin-left:6px}
.bar{height:7px;border-radius:9px;background:#ECEAF3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7C4DDB;border-radius:9px;transition:width .3s}
.clock{border-left:1px solid var(--rule);padding-left:16px;display:flex;flex-direction:column}
.clock .t{font-size:1.6rem;font-weight:800;letter-spacing:.02em;line-height:1.1}
.clock .d{font-size:.8rem;color:#5D646B;font-weight:700}

/* 右上：成績 */
#stats{position:fixed;top:var(--gt);right:var(--gr);padding:12px 16px;z-index:3;width:290px;display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700}
.row .k{color:#5A6A7E;font-size:.88rem;display:flex;align-items:center;gap:7px}
.row .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.row .v{font-size:1.05rem;font-weight:800}
#satBar{height:7px;border-radius:9px;background:#EFEDE3;overflow:hidden}
#satBar i{display:block;height:100%;background:var(--gold);width:50%;transition:width .3s}

/* 左下：所持金 */
#wallet{position:fixed;left:var(--gl);bottom:var(--gb);z-index:3;display:grid;gap:8px}
.area{padding:8px 14px;display:flex;align-items:center;gap:10px}
.area .flag{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#2F7BE5 0 30%,#fff 31% 55%,#E8412C 56%)}
.area small{display:block;color:var(--muted);font-size:.7rem;font-weight:700}
.area b{font-size:1.15rem;font-weight:800}
.money{padding:12px 18px 12px 12px;display:flex;align-items:center;gap:14px}
.coin{width:58px;height:58px;border-radius:50%;background:var(--gold);color:#7A4F00;display:grid;place-items:center;font-weight:800;font-size:1.6rem;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 0 0 3px #FFE38A;flex:0 0 auto}
.money .m{font-size:2rem;font-weight:800;line-height:1.05}
.money .r{display:inline-block;margin-top:4px;background:var(--good-bg);color:var(--good);font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:999px}

/* 下中央：メニュー */
#dock{position:fixed;left:50%;bottom:var(--gb);transform:translateX(-50%);z-index:3;display:flex;gap:8px;padding:8px}
.dbtn{appearance:none;border:0;cursor:pointer;width:76px;height:72px;border-radius:14px;color:#fff;font:inherit;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.dbtn svg{width:28px;height:28px}
.dbtn:active{transform:translateY(2px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.dbtn.on{outline:3px solid var(--ink);outline-offset:2px}

/* 右下：ズーム */
#zoom{position:fixed;right:var(--gr);bottom:var(--gb);z-index:3;display:flex;flex-direction:column;gap:8px}
.zb{appearance:none;border:1px solid var(--rule);background:var(--card);width:48px;height:48px;border-radius:12px;font:inherit;font-size:1.5rem;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.07)}
.zb.s{font-size:.72rem}
.zb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* パネル */
#panel{position:fixed;right:var(--gr);top:var(--gt);bottom:calc(var(--gb) + 96px);width:370px;max-width:calc(100% - 32px);z-index:5;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.ph h3{margin:0;font-size:1.15rem;font-weight:800;text-wrap:balance}
.ph button{appearance:none;border:0;background:#F0F1EE;width:32px;height:32px;border-radius:50%;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;color:var(--ink)}
#pBody{overflow:auto;padding:12px 16px 16px;display:grid;gap:12px;align-content:start}
.item{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.ihead{display:flex;align-items:center;gap:8px;font-weight:800}
.chip{width:14px;height:14px;border-radius:50%;background:var(--c);flex:0 0 auto}
.ihead .st{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:700}
.note{font-size:.78rem;color:var(--muted);line-height:1.6;margin:0}
.seg{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:.85rem;font-weight:700}
.seg span{min-width:0}
.tag{font-size:.68rem;background:#E8F1FA;color:#2F6FB0;padding:1px 6px;border-radius:6px;margin-left:4px;white-space:nowrap}
.buy{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:.82rem;color:#fff;background:var(--good);border-radius:10px;padding:7px 11px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);white-space:nowrap;flex:0 0 auto}
.buy:disabled{background:#C5CAC6;cursor:not-allowed}
.buy.alt{background:var(--b-line)}
.buy.warn{background:var(--bad)}
.meter{height:8px;border-radius:9px;background:#EEF0EC;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--good))}
.kv{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:#4A5157}
button:focus-visible{outline:3px solid var(--b-line);outline-offset:2px}
#toast{position:fixed;top:calc(var(--gt) + 132px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:.88rem;padding:8px 16px;border-radius:999px;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

/* スマホ */
#rankCard{position:fixed;top:calc(var(--gt) + 178px);right:var(--gr);width:290px;z-index:3;padding:12px 14px;display:grid;gap:6px}
#rankCard h4{margin:0;font-size:.92rem;font-weight:800;display:flex;align-items:center;gap:8px}
#rankCard h4 .on{margin-left:auto;font-size:.72rem;color:var(--good);background:var(--good-bg);border-radius:999px;padding:1px 8px}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:.84rem;font-weight:700;min-width:0}
.rk .n{color:#8A6D00;font-weight:800;text-align:center}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rk .sc{color:var(--good);font-weight:800;font-variant-numeric:tabular-nums}
.rk.me .nm{color:var(--b-line)}
.watch{appearance:none;border:0;cursor:pointer;width:100%;font:inherit;font-weight:800;font-size:.85rem;color:#fff;background:var(--b-line);border-radius:10px;padding:7px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
#bdTip{position:fixed;z-index:9;pointer-events:none;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:.82rem;font-weight:700;box-shadow:0 6px 20px rgba(30,35,41,.18);display:grid;gap:3px;max-width:260px}
#bdTip .tt{font-size:1.05rem;font-weight:800;color:var(--good)}
#bdTip.ng{border-color:var(--bad)} #bdTip.ng .tt{color:var(--bad)}
#bdTip .ln{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bdTip .ln i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
#notice{position:fixed;top:calc(var(--gt) + 80px);left:50%;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:9px 18px 9px 10px;font-weight:800;font-size:.95rem;background:#FFF7DA;border:2px solid var(--gold);border-radius:999px;box-shadow:0 6px 22px rgba(30,35,41,.16);max-width:calc(100% - 32px);transition:opacity .3s}
#notice .tro{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:0 0 auto}
#notice .tro svg{width:18px;height:18px}
#notice span{min-width:0}
#notice.hide{opacity:0}
#specBar{position:fixed;top:calc(var(--gt) + 184px);left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;font-weight:800;font-size:.88rem;max-width:calc(100% - 32px)}
#specBar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:.9rem;padding:7px 10px;border:1.5px solid var(--rule);border-radius:10px;color:var(--ink);background:#fff}
@media (max-width:1100px){#rankCard{display:none}}
@media (max-width:760px){
  #hudTop{left:var(--gl);transform:none;padding:6px 12px 6px 6px;gap:10px}
  .lvBadge{width:38px;height:38px;font-size:1.1rem}
  .lvText{min-width:84px}
  .clock{padding-left:10px}.clock .t{font-size:1.2rem}
  #stats{top:calc(var(--gt) + 64px);left:var(--gl);right:auto;width:auto;padding:8px 12px;gap:2px;font-size:.85rem}
  #stats .row .v{font-size:.9rem}
  #stats .hideS{display:none}
  .area{display:none}
  #wallet{bottom:calc(var(--gb) + 74px)}
  .money{padding:8px 12px 8px 8px;gap:10px}.coin{width:40px;height:40px;font-size:1.15rem}.money .m{font-size:1.35rem}
  #dock{left:var(--gl);right:var(--gr);transform:none;justify-content:space-between;gap:6px;padding:6px}
  .dbtn{flex:1;width:auto;height:58px;font-size:.78rem}.dbtn svg{width:22px;height:22px}
  #zoom{bottom:calc(var(--gb) + 80px)}
  #toast{top:calc(var(--gt) + 150px)}
  #notice{top:calc(var(--gt) + 64px);left:var(--gl);right:var(--gr);transform:none;max-width:none;border-radius:14px;font-size:.85rem}
  #panel{left:var(--gl);right:var(--gr);width:auto;max-width:none;top:auto;bottom:calc(var(--gb) + 76px);max-height:58%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="cv" aria-label="川島都市圏の路線図"></canvas>

<div id="hudTop" class="card">
  <div class="lvBadge num" id="lvNum">1</div>
  <div class="lvText"><b>レベル <span id="lvLabel">1</span><span id="lvPct" class="num">0%</span></b><div class="bar"><i id="lvBar"></i></div></div>
  <div class="clock"><span class="t num" id="clk">06:00</span><span class="d" id="date">10月28日(水)・川島</span></div>
</div>

<div id="stats" class="card">
  <div class="row"><span class="k"><i style="background:#2DA44E"></i>総収益</span><span class="v num" id="sTotal">0円</span></div>
  <div class="row"><span class="k"><i style="background:#2F7BE5"></i>乗客数</span><span class="v num" id="sRiders">0人</span></div>
  <div class="row hideS"><span class="k"><i style="background:#F0A400"></i>観光客数</span><span class="v num" id="sTour">0人</span></div>
  <div class="row"><span class="k"><i style="background:#F4B400"></i>満足度</span><span class="v num" id="sSat">100%</span></div>
  <div id="satBar" class="hideS"><i></i></div>
</div>

<div id="wallet">
  <div class="card area"><span class="flag" aria-hidden="true"></span><div><small>エリア・メイン</small><b>川島都市圏</b></div></div>
  <div class="card money"><div class="coin">¥</div><div><div class="m num" id="money">30,000円</div><span class="r num" id="rate">+0円/秒</span></div></div>
</div>

<nav id="dock" class="card">
  <button class="dbtn" style="--c:var(--b-line)" data-view="lines"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 L10 8 L14 14 L20 5"/><circle cx="4" cy="18" r="2" fill="#fff"/><circle cx="20" cy="5" r="2" fill="#fff"/></svg>路線</button>
  <button class="dbtn" style="--c:var(--b-car)" data-view="cars"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 10h14"/><circle cx="9" cy="14" r="1.2" fill="#fff"/><circle cx="15" cy="14" r="1.2" fill="#fff"/><path d="M8 18l-2 3M16 18l2 3" stroke-linecap="round"/></svg>車両</button>
  <button class="dbtn" style="--c:var(--b-sight)" data-view="sights"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>名所</button>
  <button class="dbtn" style="--c:var(--b-bank)" data-view="bank"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 2 7v2h20V7z"/><rect x="4" y="10" width="3" height="8"/><rect x="10.5" y="10" width="3" height="8"/><rect x="17" y="10" width="3" height="8"/><rect x="2" y="19" width="20" height="3"/></svg>銀行</button>
  <button class="dbtn" style="--c:#E0457B" data-view="rank"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 3h10v3a5 5 0 0 1-10 0z"/><path d="M5 4H3v2a4 4 0 0 0 4 4M19 4h2v2a4 4 0 0 1-4 4" fill="none" stroke="#fff" stroke-width="2"/><rect x="10" y="12" width="4" height="5"/><rect x="7" y="18" width="10" height="3" rx="1"/></svg>順位</button>
  <button class="dbtn" style="--c:var(--b-set)" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke-linecap="round"/></svg>設定</button>
</nav>

<div id="zoom">
  <button class="zb s" id="zFit" aria-pressed="false" aria-label="全路線を表示">全路線</button>
  <button class="zb" id="zIn" aria-label="拡大">+</button>
  <button class="zb" id="zOut" aria-label="縮小">−</button>
</div>

<div id="rankCard" class="card"><h4>オンラインランキング<span class="on" id="onlineChip" hidden></span></h4><div id="rankMini"></div><button class="watch" id="rankAll">ランキングを見る・見学する</button></div>
<div id="bdTip" hidden></div>
<div id="notice" role="status" hidden><span class="tro"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 3h10v3a5 5 0 0 1-10 0z"/><rect x="10" y="12" width="4" height="5"/><rect x="7" y="18" width="10" height="3" rx="1"/></svg></span><span id="noticeText"></span></div>
<div id="specBar" class="card" hidden><span id="specText"></span><button class="buy alt" id="specBack">自分の路線に戻る</button></div>
<aside id="panel" class="card" hidden>
  <div class="ph"><h3 id="pTitle">路線</h3><button id="pClose" aria-label="閉じる">×</button></div>
  <div id="pBody"></div>
</aside>
<div id="toast" role="status"></div>

  if (!b.size) return out;
  if (L.loop && b.size === n) return [{ names:[...L.stops], loop:true }];
  for (let i=0;i<n;i++){

  const hm = HOURS[Math.floor(S.min/60)%24];
  const op = [], nOp = {}, tourAt = {};
  for (const k of S.sights) tourAt[SIGHTS[k].st] = (tourAt[SIGHTS[k].st]||0) + SIGHTS[k].tour;
  LINES.forEach((L,li) => { const names = lineStations(li); if (names.length && S.trains[li] > 0){ op.push({li,p:{names}}); for (const n of names) nOp[n]=(nOp[n]||0)+1; } });
  let inc=0, rid=0, tou=0, dem=0; const per={}, sd={};
  for (const {li,p} of op){
    let d=0, dt=0;
    for (const n of p.names){
      const k = nOp[n], base = ST[n][2]*0.35*hm*(1+0.25*(k-1))*stBoost(n), t = (tourAt[n]||0)*(0.5+0.5*hm)*stBoost(n);
      sd[n] = base + t; d += (base+t)/k; dt += t/k;
    }
    const cap = S.trains[li]*TRAIN_CAP*condFactor(li), sv = Math.min(d,cap), fare = (7 + 0.5*S.built[li].length) * (1 + 0.001*S.tlv[li]);
    inc += sv*fare; rid += sv; tou += d ? sv*dt/d : 0; dem += d;
    per[li] = { d, cap, sv, fare };
  }
  const sat = dem ? rid/dem : 1;
  // 名所：観光収益（円/秒）と全路線の収益ボーナス。駅が開業している名所だけ効く
  let sInc = 0, bonus = 0;
  for (const k of S.sights){ const sg = SIGHTS[k]; if (sg && isOpen(sg.st)){ sInc += sg.inc*(0.5+0.5*hm); bonus += sg.bonus/100; } }
  R = { inc: inc*(1+0.1*sat)*(1+bonus) + sInc, rid, tou, sat, per, dem:sd, sInc, bonus };
}

/* ================= 操作 ================= */
function buildSeg(li,i){
  const b = buildState(li,i); if (!b.ok){ toast(b.why); return; }
  const [a,c] = ends(li,i);
  S.money -= b.cost; S.invest = (S.invest||0) + b.cost; S.built[li].push(i);
  let msg = `${LINES[li].name} ${a}〜${c} が開業しました`;
  if (S.trains[li] === 0){ S.trains[li] = 1; msg += '（1編成つき）'; }
  if (LINES[li].loop && S.built[li].length === nSegs(li)) msg = `${LINES[li].name}が一周つながりました！`;
  if (S.built[li].length === nSegs(li)){ seenDone.add((NET.me || 'local') + ':' + li); announce(NET.me, S.company, li); }
  toast(msg); changed();
}
function act(a){
  const [k, x, y] = a.split(':'), li = +x;
  if (k === 'build') return buildSeg(li, +y);
  if (k === 'train'){ const c=trainCost(li); if (S.trains[li] >= maxTrains(li)) return toast('路線を延ばすと編成の上限が増えます'); if (S.money<c) return toast('お金が足りません'); S.money-=c; S.invest = (S.invest||0) + c; S.trains[li]++; toast(`${LINES[li].name}に1編成増発しました`); }
  if (k === 'sight'){ const s=SIGHTS[li]; if (S.money<s.cost) return; S.money-=s.cost; S.invest = (S.invest||0) + s.cost; S.sights.push(li); toast(`${s.name}がオープンしました`); }
  if (k === 'loan'){ const amt = 50000*S.lv; S.money += amt; S.loan = Math.round(amt*1.1); toast(`${yen(amt)}を借りました`); }
  if (k === 'repay'){ if (S.money < S.loan) return toast('返済するお金が足りません'); S.money -= S.loan; S.loan = 0; toast('借入を返済しました'); }
  if (k === 'names'){ S.names = !S.names; }
  if (k === 'company'){ S.company = $('companyName').value.trim().slice(0,20); toast('会社名を保存しました'); setTimeout(pushScore, 50); }
  if (k === 'watch'){ startSpec(x); return; }
  if (k === 'tlv'){ const c = tlvCost(li); if (S.tlv[li] >= TLV_MAX) return; if (S.money < c) return toast('お金が足りません'); S.money -= c; S.invest = (S.invest||0) + c; S.tlv[li]++; toast(`${LINES[li].name}の車両がLv${S.tlv[li]}になりました`); }
  if (k === 'fix'){ const c = repairCost(li); if (S.money < c) return toast('お金が足りません'); S.money -= c; S.invest = (S.invest||0) + c; S.cond[li] = 100; toast(`${LINES[li].name}の車両を修理しました`); }
  if (k === 'fixall'){ const ops = LINES.map((L,i)=>i).filter(i => S.built[i].length), c = ops.reduce((a,i) => a + repairCost(i), 0);
    if (S.money < c) return toast('お金が足りません'); S.money -= c; S.invest = (S.invest||0) + c; ops.forEach(i => S.cond[i] = 100); toast('全路線の車両を修理しました'); }
  if (k === 'upst'){ const c = upCost(x); if (stLv(x) >= ST_MAX || !stationLines(x,true).length) return; if (S.money < c) return toast('お金が足りません');
    S.money -= c; S.invest = (S.invest||0) + c; S.stLv[x] = stLv(x) + 1; toast(`${x}駅がLv${S.stLv[x]}になりました（乗客 +${S.stLv[x]*40}%）`); }
  if (k === 'reset'){ if (resetArm > performance.now()){ S = fresh(); resetArm=0; fitView(); toast('最初からやり直します'); } else { resetArm = performance.now()+3000; toast('もう一度押すとデータを消して最初から始めます'); } }
  if (k === 'go'){ const p = pt(x); cam.x=p.x; cam.y=p.y; cam.z=Math.max(cam.z,1.1); clampCam(); }
  if (k === 'open'){ openPanel(x); return; }
  changed();
}
let resetArm = 0;
function changed(){
  const nl = levelFor(S.total);
  if (nl > S.lv){
    S.lv = nl; toast(`レベル${nl}になりました！銀行で借りられる額が増えました`);
  }

}

const cv = $('cv'), ctx = cv.getContext('2d');
const cam = { x:W/2, y:H/2, z:0.5 }; let cw=0, ch=0, dpr=1, fitZ=0.5;
function resize(){ cw = innerWidth; ch = innerHeight; dpr = Math.min(2, devicePixelRatio||1); cv.width = cw*dpr; cv.height = ch*dpr;
  fitZ = Math.min(cw/(W+160), ch/(H+260)); clampCam(); }
function fitView(){ cam.x = W/2; cam.y = H/2 + 20; cam.z = fitZ; }
function clampCam(){ cam.z = Math.min(3.5, Math.max(fitZ*0.7, cam.z)); cam.x = Math.min(W+100, Math.max(-100, cam.x)); cam.y = Math.min(H+100, Math.max(-100, cam.y)); }
const toWorld = (sx,sy) => ({ x:(sx-cw/2)/cam.z + cam.x, y:(sy-ch/2)/cam.z + cam.y });

function offsets(){
  const m = new Map();
  LINES.forEach((L,li) => { for (let i=0;i<nSegs(li);i++){ const [a,b]=ends(li,i), k=[a,b].sort().join('|'); if(!m.has(k)) m.set(k,[]); m.get(k).push(li); } });
  return m;
}
const OFFS = offsets();
function segXY(li,a,b){
  const k=[a,b].sort().join('|'), arr=OFFS.get(k)||[li], [lo,hi]=[a,b].sort();
  const dx=ST[hi][0]-ST[lo][0], dy=ST[hi][1]-ST[lo][1], len=Math.hypot(dx,dy)||1;
  const o=(arr.indexOf(li)-(arr.length-1)/2)*5/cam.z, px=-dy/len*o, py=dx/len*o;
  return [ST[a][0]+px, ST[a][1]+py, ST[b][0]+px, ST[b][1]+py];
}
function pathPoint(names, loop, d){
  const pts = names.map(n => ST[n]); if (loop) pts.push(pts[0]);
  for (let i=0;i<pts.length-1;i++){ const L=Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
    if (d <= L){ const t=d/L; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t, Math.atan2(pts[i+1][1]-pts[i][1], pts[i+1][0]-pts[i][0])]; }
    d -= L; }

  for (let i=0;i<LINES.length;i++) if (S.trains[i] > 0 && S.built[i].length){ const before = S.cond[i];

    if (before >= 30 && S.cond[i] < 30) toast(`${LINES[i].name}の車両が傷んでいます。「車両」から修理しましょう`); }
  S.avgInc = (S.avgInc || 0) + (R.inc - (S.avgInc || 0)) * Math.min(1, dt/600);
  S.min += dt; S.money += R.inc*dt; S.total += R.inc*dt; S.riders += R.rid*dt; S.tourists += R.tou*dt;
  slow += dt; if (slow > 0.25){ slow = 0; const before = S.lv; computeRates(); hud(); if (view) refreshButtons();
    if (levelFor(S.total) > before) changed(); }
  saveT += dt; if (saveT > 5){ saveT = 0; save(); }
  if (SPEC){ const b=S.built, t=S.trains, g=S.sights, l=S.stLv; S.built=SPEC.built; S.trains=SPEC.trains; S.sights=SPEC.sights; S.stLv=SPEC.stLv;
    try { draw(); } finally { S.built=b; S.trains=t; S.sights=g; S.stLv=l; } } else draw();
  requestAnimationFrame(frame);
}
addEventListener('pagehide', save);

/* ================= オンライン（ランキング・見学） ================= */
// 路線完成のお知らせ（自分の完成はその場で、他の人の完成はランキングの更新から検出）
const seenDone = new Set(), noticeQ = []; let doneBase = false, noticeBusy = false;
function checkCompletions(rows){
  const found = [];
  for (const r of rows){
    let b = []; try { b = JSON.parse(r.built || '[]'); } catch(e){}
    LINES.forEach((L,li) => {
      if (!Array.isArray(b[li]) || new Set(b[li]).size < nSegs(li)) return;
      const k = r.id + ':' + li;
      if (!seenDone.has(k)){ seenDone.add(k); if (doneBase) found.push([r,li]); }
    });
  }
  doneBase = true;
  for (const [r,li] of found) announce(r.id, r.company, li);
}
async function announce(id, company, li){
  let name = company || '';
  if (!name && id === NET.me) name = 'あなた';
  if (!name && id && NET.user){ try { const ps = await NET.user.profiles([id]); name = (ps[id] && ps[id].name) || ''; } catch(e){} }
  noticeQ.push(`${name || 'プレイヤー'}が${LINES[li].name}を完成させました！`);
  showNotice();
}
function showNotice(){
  if (noticeBusy || !noticeQ.length) return;
  noticeBusy = true; const el = $('notice');
  $('noticeText').textContent = noticeQ.shift(); el.hidden = false; el.classList.remove('hide');
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => { el.hidden = true; noticeBusy = false; showNotice(); }, 350); }, 5000);
}
const NET = { db:null, user:null, me:null, rows:[], online:0, err:null, names:{} };
let SPEC = null, pushing = false, lastPush = '';
const man = n => n >= 1e8 ? `${Math.floor(n/1e8)}億${Math.floor(n%1e8/1e4)}万円` : n >= 1e4 ? `${Math.floor(n/1e4)}万円` : yen(n);
/* ===== Firebase の設定（Firebaseコンソール →「プロジェクトの設定」→「マイアプリ」の firebaseConfig を貼り付け） ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAQ9SlsHUkzkh2a9YlpQxz1yYHD5wPHg-4",
  authDomain: "kawashimagame-3c0a8.firebaseapp.com",
  databaseURL: "https://kawashimagame-3c0a8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kawashimagame-3c0a8",
  appId: "1:1074404017591:web:820c7d4a095100d2911432"
};
async function initNet(){
  askCompany();
  if (!window.firebase || !FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL){ renderRank(); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();           // 見えないログイン（会社名だけで参加）
    NET.me = firebase.auth().currentUser.uid;
    const db = firebase.database(); NET.fdb = db; NET.db = true;
    db.ref('ranking').orderByChild('total').limitToLast(100).on('value', snap => {
      const rows = []; snap.forEach(c => { rows.push({ id:c.key, ...c.val() }); });
      rows.sort((a,b) => (b.total||0) - (a.total||0));
      NET.rows = rows; checkCompletions(rows); renderRank();
    }, () => { NET.err = 'read'; renderRank(); });
    const me = db.ref('presence/' + NET.me);
    db.ref('.info/connected').on('value', s => { if (s.val()){ me.onDisconnect().remove(); me.set(true); } });
    db.ref('presence').on('value', s => { NET.online = s.numChildren(); renderRank(); });
    pushScore(); setInterval(pushScore, 20000);
  } catch(e){ NET.err = 'connect'; console.error(e); }
  renderRank();
}
function askCompany(){
  if (S.company) return;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(30,35,41,.35);padding:16px';
  ov.innerHTML = `<div class="card" style="max-width:380px;width:100%;padding:20px;display:grid;gap:12px">
    <b style="font-size:1.15rem">会社名を決めてください</b>
    <span class="note">ランキングに表示されます。あとから「設定」で変えられます。</span>
    <div class="field"><input id="joinName" maxlength="20" placeholder="例：川島急行電鉄"><button class="buy" id="joinBtn">はじめる</button></div></div>`;
  document.body.appendChild(ov);
  const go = () => { const v = $('joinName').value.trim().slice(0,20); if (!v){ $('joinName').focus(); return; }
    S.company = v; save(); ov.remove(); setTimeout(pushScore, 50); };
  $('joinBtn').onclick = go; $('joinName').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => $('joinName').focus(), 50);
}
async function pushScore(){
  if (!NET.db || !NET.me || pushing) return;
  const body = { company:S.company||'', total:Math.floor(S.total), riders:Math.floor(S.riders), lv:S.lv, segs:totalBuilt(),
    built:JSON.stringify(S.built), stLv:JSON.stringify(S.stLv), trains:S.trains.slice(), sights:S.sights.slice(), updated:Date.now() };
  const sig = JSON.stringify([Math.floor(body.total/1000), body.stLv, body.segs, body.company, body.sights.length, body.trains]);
  if (sig === lastPush) return;
  pushing = true;
  try { await NET.fdb.ref('ranking/' + NET.me).set(body); lastPush = sig; NET.err = null; }
  catch(e){ NET.err = (e && e.code) || 'error'; }
  pushing = false; renderRank();
}
function rankHTML(full){
  if (!NET.db) return `<p class="note">${NET.err === 'connect' ? 'サーバーにつながりませんでした。設定を確認してください。' : 'オンライン機能は Firebase の設定をすると使えます。'}</p>`;
  let h = '';
  if (full){
    h += `<p class="note">同じページで遊んでいる人と総収益を競います。${NET.online ? `いまオンライン ${NET.online}人。` : ''}「見学」で相手の路線網を地図で見られます。会社名は設定から変えられます。</p>`;
    if (NET.err && NET.err !== 'read') h += `<p class="note" style="color:var(--bad)">あなたの記録を送れませんでした。通信状態か Firebase のルール設定を確認してください。</p>`;
  }
  const rows = full ? NET.rows : NET.rows.slice(0,5);
  if (!rows.length) h += `<p class="note">まだ記録がありません。区間を建設すると載ります。</p>`;
  rows.forEach((r,i) => {
    const me = r.id === NET.me;
    h += `<div class="rk${me?' me':''}"><span class="n">${i+1}</span><span class="nm" data-uid="${r.id}" data-co="${encodeURIComponent(r.company||'')}">…</span><span class="sc">${man(r.total||0)}</span></div>`;
    if (full) h += `<div class="seg" style="margin:-4px 0 4px 30px"><span class="note">Lv${r.lv||1}・${r.segs||0}区間・乗客 ${ppl(r.riders||0)}</span>${me?'':`<button class="buy alt" data-act="watch:${r.id}">見学</button>`}</div>`;
  });
  if (!full){ const mi = NET.rows.findIndex(r => r.id === NET.me); if (mi >= 5) h += `<div class="rk me"><span class="n">${mi+1}</span><span class="nm" data-uid="${NET.me}" data-co="${encodeURIComponent(S.company||'')}">…</span><span class="sc">${man(NET.rows[mi].total||0)}</span></div>`; }
  return h;
}
async function fillNames(root){
  const els = [...root.querySelectorAll('[data-uid]')];
  const ids = [...new Set(els.map(e => e.dataset.uid))];
  let ps = {};
  if (NET.user && ids.length){ try { ps = await NET.user.profiles(ids); } catch(e){} }
  for (const e of els){
    const co = decodeURIComponent(e.dataset.co || ''), nm = (ps[e.dataset.uid] && ps[e.dataset.uid].name) || '';
    e.textContent = (co || nm || 'プレイヤー') + (co && nm ? `（${nm}）` : '') + (e.dataset.uid === NET.me ? ' ・あなた' : '');
  }
}
function renderRank(){
  const c = $('onlineChip'); c.hidden = !NET.online; c.textContent = `オンライン ${NET.online}人`;
  $('rankMini').innerHTML = rankHTML(false); fillNames($('rankMini'));
  if (view === 'rank') renderPanel();
  if (SPEC){ const r = NET.rows.find(r => r.id === SPEC.id); if (r) loadSpec(r); }
}
function loadSpec(r){
  let built = []; try { built = JSON.parse(r.built || '[]'); } catch(e){}
  SPEC = { id:r.id, built: LINES.map((L,i) => Array.isArray(built[i]) ? built[i].filter(n => Number.isInteger(n) && n >= 0 && n < nSegs(i)) : []),
    trains: LINES.map((L,i) => Math.max(0, Math.min(999, +(r.trains||[])[i] || 0))), sights: (r.sights||[]).filter(k => Number.isInteger(k) && SIGHTS[k]), stLv:{} };
  try { const o = JSON.parse(r.stLv || '{}'); for (const k in o) if (ST[k] && Number.isInteger(o[k])) SPEC.stLv[k] = Math.max(0, Math.min(ST_MAX, o[k])); } catch(e){}
}
async function startSpec(id){
  const r = NET.rows.find(r => r.id === id); if (!r) return;
  loadSpec(r); closePanel();
  const el = document.createElement('span'); el.dataset.uid = id; el.dataset.co = encodeURIComponent(r.company||''); await fillNames({ querySelectorAll:() => [el] });
  $('specText').textContent = `${el.textContent} の路線網を見学中（${man(r.total||0)}）`; $('specBar').hidden = false;
}
$('specBack').onclick = () => { SPEC = null; $('specBar').hidden = true; };
$('rankAll').onclick = () => openPanel('rank');
const _changed = changed; changed = function(){ _changed(); setTimeout(pushScore, 300); };

resize(); fitView(); computeRates(); hud(); initNet();
// 留守の間の収益
(function(){ const el = Math.min(10800, (Date.now() - S.saved)/1000);
  if (S.rate > 0 && el > 30){ const g = S.rate*el*0.5; S.money += g; S.total += g; toast(`留守の間に ${yen(g)} 稼ぎました`); }
  else if (!totalBuilt()) { openPanel('lines'); toast('好きな路線の区間を建設してスタートしましょう'); } })();
requestAnimationFrame(frame);
</script>
